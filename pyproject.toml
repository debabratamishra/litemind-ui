[project]
name = "litemind-ui"
version = "0.0.16"
description = "LiteMindUI - A comprehensive AI assistant with RAG, web search, and multimodal capabilities"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
    # Shared core dependencies
    "python-dotenv",
    "psutil",
]

[tool.uv]
# Install profiles via dependency groups: core / ml / voice / ocr / dev / all.
# `uv sync --group all` installs everything; a core-only image needs just core.

[dependency-groups]
# Install profiles. `core` is the always-required set: a core-only image must
# boot (`import backend.main`) without chromadb/torch/transformers/pipecat/
# kokoro/librosa/easyocr/cv2/crewai importable at module level.
core = [
    # Core FastAPI + server plumbing
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "pydantic",
    "httpx",
    "requests",
    "python-dotenv",
    "psutil",
    "rank-bm25",
    "asyncpg",
    "cryptography",
    "litellm",
    "ollama",
]

ml = [
    # RAG: vector store, embeddings, retrieval tooling
    "chromadb",
    "sentence-transformers",
    "torch",
    "torchvision",
    "transformers",
    "accelerate",
    "huggingface-hub",
    "numpy",
    "pandas",
    "crewai",
    "nltk",
]

voice = [
    # Realtime voice mode: Pipecat WebRTC transport + Silero VAD
    "pipecat-ai",
    # Optional dep required by the Pipecat small-webrtc transport (SmallWebRTCConnection)
    "aiortc",
    "pyttsx3",
    "kokoro",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "librosa",
    "soundfile",
]

ocr = [
    # Document ingestion: OCR + PDF/Office extraction
    "easyocr",
    "opencv-python-headless",
    "camelot-py[cv]",
    "Pillow",
    "PyMuPDF",
    "pdfplumber",
    "python-docx",
    "python-pptx",
    "bs4",
    "trafilatura",
    "striprtf",
    "odfpy",
    "openpyxl",
    "PyYAML",
]

dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "ty>=0.0.60",
]

# Union of every install profile, for local development
all = [
    # core
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "pydantic",
    "httpx",
    "requests",
    "python-dotenv",
    "psutil",
    "rank-bm25",
    "asyncpg",
    "cryptography",
    "litellm",
    "ollama",
    # ml
    "chromadb",
    "sentence-transformers",
    "torch",
    "torchvision",
    "transformers",
    "accelerate",
    "huggingface-hub",
    "numpy",
    "pandas",
    "crewai",
    "nltk",
    # voice
    "pipecat-ai",
    "aiortc",
    "pyttsx3",
    "kokoro",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "librosa",
    "soundfile",
    # ocr
    "easyocr",
    "opencv-python-headless",
    "camelot-py[cv]",
    "Pillow",
    "PyMuPDF",
    "pdfplumber",
    "python-docx",
    "python-pptx",
    "bs4",
    "trafilatura",
    "striprtf",
    "odfpy",
    "openpyxl",
    "PyYAML",
]

# Configure PyTorch to use CPU-only version
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = []

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ty]
environment = { python-version = "3.13" }

# `pipecat` is an optional dependency (the `voice` group). CI's `ty` job
# installs `--group all --group dev`, but its submodules are allowed as
# unresolved imports so type-checking of the voice pipeline stays robust. New
# `pipecat.*` imports must be added here to avoid `unresolved-import`.
[tool.ty.analysis]
allowed-unresolved-imports = [
    "pipecat.audio.vad.silero",
    "pipecat.audio.vad.vad_analyzer",
    "pipecat.frames.frames",
    "pipecat.pipeline.pipeline",
    "pipecat.pipeline.worker",
    "pipecat.processors.aggregators.llm_context",
    "pipecat.processors.aggregators.llm_response_universal",
    "pipecat.processors.audio.vad_processor",
    "pipecat.processors.frame_processor",
    "pipecat.services.openai.base_llm",
    "pipecat.services.settings",
    "pipecat.services.stt_service",
    "pipecat.services.tts_service",
    "pipecat.transports.base_transport",
    "pipecat.transports.smallwebrtc.connection",
    "pipecat.transports.smallwebrtc.transport",
    "pipecat.workers.runner",
]

[tool.pytest.ini_options]
# Async tests (Pipecat voice pipeline) run via the anyio pytest plugin, which
# is auto-discovered; enable auto mode so plain `async def test_*` are run.
anyio_mode = "auto"
testpaths = ["tests"]
# Coverage is reported for visibility; there is intentionally NO fail_under
# gate (the goal is comprehensive per-module tests, not a hard percentage).
addopts = "--cov=backend --cov-report=term-missing"
